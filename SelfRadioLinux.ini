LastDirectory=/home/uzair/
LastTrackPath=

[Keys]
; Use System.Windows.Forms.Keys names
KeyMenu=J
KeyPause=O
KeyNext=K
KeyPrev=I
KeyVolUp=Oemplus
KeyVolDown=OemMinus
KeyShuffle=OemSemicolon
