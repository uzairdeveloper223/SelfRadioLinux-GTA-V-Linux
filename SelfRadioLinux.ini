; Self Radio Linux
[Settings]
MusicDir=/home/uzair/
Volume=0.55
Shuffle=0
ShowHud=1
AutoRadioOff=1
PauseOnFocus=1
ShowProgress=1
SpeedVolume=0
VehicleOnly=1
AutoPlayInVehicle=1
PositionalAudio=1
MaxAudibleDistance=60
ThemeIndex=1
CurrentIndex=0
RepeatMode=2
ShowVisualizer=1
VisualizerPosition=0
VisualizerAlwaysVisible=1
